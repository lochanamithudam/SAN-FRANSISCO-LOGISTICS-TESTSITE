services:
  mongodb:
    image: mongo:latest
    container_name: san-francisco-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - Mithu-DB-Storage:/data/db

  san-francisco-app:
    build: .
    container_name: san-francisco-logistics-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/sanFranciscoDB
    depends_on:
      - mongodb
    restart: always

volumes:
  Mithu-DB-Storage:
    external: true
